dataFlows:
  - description: Complete data flow for the GET / endpoint, which serves the static HTML content from 'wwwroot/index.html'.
    trigger:
      type: http-request
      component: GET /
      action: HTTP GET request to /
    steps:
      - order: 1
        location: Controllers/QuoteController.cs/Index
        action: The HTTP GET request hits the '/' route, which is handled by the Index method in QuoteController.
        dataShape:
          urlPath: /
          httpMethod: GET
        sideEffects:
          - Reads the 'wwwroot/index.html' file from disk.
      - order: 2
        location: System.IO.File.ReadAllText
        action: Reads the content of the 'wwwroot/index.html' file from the file system.
        dataShape:
          filePath: wwwroot/index.html
        sideEffects:
          - File read operation from disk.
      - order: 3
        location: Controllers/QuoteController.cs/Index
        action: The file content is wrapped in a ContentResult object and returned as the HTTP response.
        dataShape:
          fileContent: Raw HTML content
  - description: This flow handles an HTTP GET request to the /api/health endpoint. It returns a JSON response indicating
      the health status of the application.
    trigger:
      type: http-request
      component: GET /api/health
      action: HTTP GET request to /api/health
    steps:
      - order: 1
        location: Controllers/QuoteController.cs, Health() method
        action: The Health() method is invoked to handle the HTTP GET request. The method constructs a JSON object with health
          status details and returns it as a response.
        dataShape:
          httpRequest: GET /api/health
  - description: This data flow handles a GET request to the /api/quote endpoint. It validates query parameters, performs
      calculations based on business rules, and returns a JSON response with the computed quote details.
    trigger:
      type: http-request
      component: GET /api/quote
      action: HTTP GET request to /api/quote
    steps:
      - order: 1
        location: QuoteController.cs/Quote()
        action: Extracts 'quantity' and 'delivery' query parameters from the HTTP request.
        dataShape:
          quantity: string[]
          delivery: string[]
      - order: 2
        location: QuoteController.cs/Quote()
        action: Validates the 'quantity' parameter to ensure it is a single, non-empty integer between 1 and 100.
        dataShape:
          quantityText: string
        sideEffects:
          - Returns HTTP 400 Bad Request if validation fails.
      - order: 3
        location: QuoteController.cs/Quote()
        action: Validates the 'delivery' parameter to ensure it is either 'standard' or 'rush'.
        dataShape:
          delivery: string
        sideEffects:
          - Returns HTTP 400 Bad Request if validation fails.
      - order: 4
        location: QuoteController.cs/Quote()
        action: Calculates the subtotal in cents based on the quantity and unit price (1250 cents per unit).
        dataShape:
          quantity: integer
          unitPriceCents: integer
      - order: 5
        location: QuoteController.cs/Quote()
        action: Calculates the discount in cents if the quantity is 10 or more.
        dataShape:
          quantity: integer
          subtotalCents: integer
      - order: 6
        location: QuoteController.cs/Quote()
        action: Calculates shipping costs in cents based on delivery type and quantity.
        dataShape:
          delivery: string
          quantity: integer
      - order: 7
        location: QuoteController.cs/Quote()
        action: Computes the total cost in cents by adding subtotal, subtracting discounts, and adding shipping costs.
        dataShape:
          subtotalCents: integer
          discountCents: integer
          shippingCents: integer
      - order: 8
        location: QuoteController.cs/Quote()
        action: Returns a JSON response containing all calculated data including quantity, delivery type, subtotal, discount,
          shipping, total, and currency.
        dataShape:
          quantity: integer
          delivery: string
          subtotalCents: integer
          discountCents: integer
          shippingCents: integer
          totalCents: integer
