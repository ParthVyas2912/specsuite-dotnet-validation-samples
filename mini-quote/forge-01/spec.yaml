        sourceCode: "    [HttpGet(\"/api/quote\")]\r

          \    public IActionResult Quote()\r

          \    {\r

          \        var quantityValues = Request.Query[\"quantity\"];\r

          \        var deliveryValues = Request.Query[\"delivery\"];\r

          \        var quantityText = quantityValues.ToString();\r

          \        if (quantityValues.Count != 1 || quantityText.Length == 0\r

          \            || quantityText.Any(c => c < '0' || c > '9')\r

          \            || !int.TryParse(quantityText, NumberStyles.None, CultureInfo.InvariantCulture, out var
          quantity)\r

          \            || quantity < 1 || quantity > 100)\r

          \        {\r

          \            return BadRequest(new { error = \"Quantity must be an integer from 1 to 100.\" });\r

          \        }\r

          \        var delivery = deliveryValues.ToString();\r

          \        if (deliveryValues.Count != 1 || (delivery != \"standard\" && delivery != \"rush\"))\r

          \        {\r

          \            return BadRequest(new { error = \"Delivery must be standard or rush.\" });\r

          \        }\r

          \r

          \        const int unitPriceCents = 1250;\r

          \        var subtotalCents = quantity * unitPriceCents;\r

          \        var discountCents = quantity >= 10 ? subtotalCents / 10 : 0;\r

          \        var shippingCents = delivery == \"rush\" ? 750 : quantity >= 10 ? 0 : 250;\r

          \        var totalCents = subtotalCents - discountCents + shippingCents;\r

          \        return Ok(new\r

          \        {\r

          \            quantity, delivery, currency = \"CAD\", unitPriceCents,\r

          \            subtotalCents, discountCents, shippingCents, totalCents\r

          \        });\r

          \    }\r"
