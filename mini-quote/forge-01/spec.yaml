        <body>\r

        <main>\r

        \  <h1>Mini Quote</h1>\r

        \  <p>A small, synthetic order calculator. All amounts are in Canadian dollars.</p>\r

        \  <section aria-label=\"Quote calculator\">\r

        \    <p>Items cost $12.50 each. Order 10 or more for 10% off and free standard delivery.\r

        \       Standard delivery otherwise costs $2.50; rush delivery always costs $7.50.</p>\r

        \    <form id=\"quote-form\" novalidate>\r

        \      <label for=\"quantity\">Quantity</label>\r

        \      <input id=\"quantity\" name=\"quantity\" type=\"number\" min=\"1\" max=\"100\" step=\"1\" value=\"1\"
        required>\r

        \      <label for=\"delivery\">Delivery</label>\r

        \      <select id=\"delivery\" name=\"delivery\">\r

        \        <option value=\"standard\">Standard</option>\r

        \        <option value=\"rush\">Rush</option>\r

        \      </select>\r

        \      <button type=\"submit\" id=\"calculate\">Calculate quote</button>\r

        \    </form>\r

        \    <output id=\"result\" aria-live=\"polite\">Enter a quantity and calculate a quote.</output>\r

        \    <p id=\"error\" role=\"alert\"></p>\r

        \  </section>\r

        \  <footer>Synthetic demo only. No payment, sign-in, order storage, or external services.</footer>\r

        </main>\r

        <script>\r

        \  const form = document.getElementById(\"quote-form\");\r

        \  const button = document.getElementById(\"calculate\");\r

        \  const result = document.getElementById(\"result\");\r

        \  const error = document.getElementById(\"error\");\r

        \  const money = cents => \"$\" + (cents / 100).toFixed(2);\r

        \  form.addEventListener(\"submit\", async event => {\r

        \    event.preventDefault();\r

        \    button.disabled = true;\r

        \    error.textContent = \"\";\r

        \    result.textContent = \"\";\r

        \    try {\r

        \      const query = new URLSearchParams(new FormData(form));\r

        \      const response = await fetch(\"/api/quote?\" + query);\r

        \      const quote = await response.json();\r

        \      if (!response.ok) {\r

        \        error.textContent = quote.error || \"Unable to calculate quote.\";\r

        \        return;\r

        \      }\r

        \      result.textContent = \"Subtotal: \" + money(quote.subtotalCents)\r

        \        + \"\\nDiscount: \" + money(quote.discountCents)\r

        \        + \"\\nDelivery: \" + money(quote.shippingCents)\r

        \        + \"\\nTotal: \" + money(quote.totalCents) + \" CAD\";\r

        \    } catch {\r

        \      error.textContent = \"Unable to reach the quote service.\";\r

        \    } finally {\r

        \      button.disabled = false;\r

        \    }\r

        \  });\r

        </script>\r

        </body>\r

        </html>\r\n"
