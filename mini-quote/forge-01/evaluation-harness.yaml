    assertions:
      - type: behavior-check
        subject: GET /
        expected: completes
        explanation: Flow runs end-to-end
      - type: behavior-check
        subject: GET / trigger
        expected: http-request
        explanation: Triggered by http-request
      - type: behavior-check
        subject: GET / steps
        expected: The HTTP GET request hits the '/' route, which is handled by the Index method in QuoteController. → Reads the
          content of the 'wwwroot/index.html' file from the file system. → The file content is wrapped in a
          ContentResult object and returned as the HTTP response.
        explanation: All steps execute in order
    priority: medium
  - id: data-flow-0016
    name: "Data flow: GET /api/health"
    category: data-flow
    target: GET /api/health
    description: This flow handles an HTTP GET request to the /api/health endpoint. It returns a JSON response indicating
      the health status of the application.
    assertions:
      - type: behavior-check
        subject: GET /api/health
        expected: completes
        explanation: Flow runs end-to-end
      - type: behavior-check
        subject: GET /api/health trigger
        expected: http-request
        explanation: Triggered by http-request
      - type: behavior-check
        subject: GET /api/health steps
        expected: The Health() method is invoked to handle the HTTP GET request. The method constructs a JSON object with health
          status details and returns it as a response.
        explanation: All steps execute in order
    priority: medium
  - id: data-flow-0017
    name: "Data flow: GET /api/quote"
    category: data-flow
    target: GET /api/quote
    description: This data flow handles a GET request to the /api/quote endpoint. It validates query parameters, performs
      calculations based on business rules, and returns a JSON response with the computed quote details.
    assertions:
      - type: behavior-check
        subject: GET /api/quote
        expected: completes
        explanation: Flow runs end-to-end
      - type: behavior-check
        subject: GET /api/quote trigger
        expected: http-request
        explanation: Triggered by http-request
      - type: behavior-check
        subject: GET /api/quote steps
        expected: Extracts 'quantity' and 'delivery' query parameters from the HTTP request. → Validates the 'quantity'
          parameter to ensure it is a single, non-empty integer between 1 and 100. → Validates the 'delivery' parameter
          to ensure it is either 'standard' or 'rush'. → Calculates the subtotal in cents based on the quantity and unit
          price (1250 cents per unit). → Calculates the discount in cents if the quantity is 10 or more. → Calculates
          shipping costs in cents based on delivery type and quantity. → Computes the total cost in cents by adding
          subtotal, subtracting discounts, and adding shipping costs. → Returns a JSON response containing all
          calculated data including quantity, delivery type, subtotal, discount, shipping, total, and currency.
        explanation: All steps execute in order
    priority: medium
