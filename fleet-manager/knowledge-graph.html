const typeColors = {
  project: '#f0883e', module: '#58a6ff', function: '#7ee787', class: '#d2a8ff',
  interface: '#bc8cff', type: '#b392f0', route: '#f778ba', component: '#ff7b72',
  model: '#ffa657', field: '#484f58', middleware: '#56d4dd', service: '#79c0ff',
  configuration: '#8b949e', 'environment-variable': '#7d8590', dependency: '#636c76',
  integration: '#d29922', 'data-flow': '#3fb950', event: '#db61a2',
};

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('svg').attr('width', width).attr('height', height);
const g = svg.append('g');

// Zoom
svg.call(d3.zoom().scaleExtent([0.1, 8]).on('zoom', (e) => g.attr('transform', e.transform)));

const simulation = d3.forceSimulation(DATA.nodes)
  .force('link', d3.forceLink(DATA.links).id(d => d.id).distance(100))
  .force('charge', d3.forceManyBody().strength(-120))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(20));

const link = g.append('g').selectAll('line')
  .data(DATA.links).join('line')
  .attr('class', 'link')
  .attr('stroke', '#30363d')
  .attr('stroke-width', 1);

const node = g.append('g').selectAll('g')
  .data(DATA.nodes).join('g')
  .attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd));

node.append('circle')
  .attr('r', d => sizeFor(d.type))
  .attr('fill', d => typeColors[d.type] || '#8b949e')
  .attr('stroke', '#0d1117')
  .attr('stroke-width', 1.5);

node.append('text')
  .attr('dx', d => sizeFor(d.type) + 3)
  .attr('dy', 3)
  .text(d => d.name.length > 24 ? d.name.slice(0, 22) + '…' : d.name);

function sizeFor(type) {
  if (type === 'project') return 16;
  if (type === 'module') return 10;
  if (['function', 'class', 'route', 'model', 'component'].includes(type)) return 6;
  return 4;
}

// Tooltip
const tooltip = d3.select('#tooltip');
node.on('mouseover', (e, d) => {
  tooltip.style('display', 'block')
    .style('left', (e.pageX + 12) + 'px').style('top', (e.pageY - 12) + 'px');
  tooltip.select('h3').text(d.name);
  tooltip.select('.type').text(d.type + (d.domain !== 'unknown' ? ' · ' + d.domain : ''));
  tooltip.select('.desc').text(d.description);
}).on('mouseout', () => tooltip.style('display', 'none'));

// Search
d3.select('#search').on('input', function() {
  const q = this.value.toLowerCase();
  node.style('opacity', d => !q || d.name.toLowerCase().includes(q) || d.type.includes(q) ? 1 : 0.1);
  link.style('opacity', l => {
    if (!q) return 1;
    const sn = typeof l.source === 'object' ? l.source.name : l.source;
    const tn = typeof l.target === 'object' ? l.target.name : l.target;
    return sn.toLowerCase().includes(q) || tn.toLowerCase().includes(q) ? 1 : 0.05;
  });
});

// Type filters
const types = [...new Set(DATA.nodes.map(n => n.type))].sort();
const filtersDiv = d3.select('#type-filters');
types.forEach(t => {
  const label = filtersDiv.append('label');
  label.append('input').attr('type', 'checkbox').attr('checked', true).on('change', applyFilters);
  label.append('span').style('color', typeColors[t] || '#8b949e').text(' ' + t + ' (' + DATA.nodes.filter(n => n.type === t).length + ')');
});

function applyFilters() {
  const active = new Set();
  filtersDiv.selectAll('input').each(function(d, i) { if (this.checked) active.add(types[i]); });
  node.style('display', d => active.has(d.type) ? null : 'none');
  link.style('display', l => {
    const st = typeof l.source === 'object' ? l.source.type : null;
    const tt = typeof l.target === 'object' ? l.target.type : null;
    return (st && active.has(st)) && (tt && active.has(tt)) ? null : 'none';
  });
}

// Sliders
d3.select('#distance').on('input', function() { simulation.force('link').distance(+this.value); simulation.alpha(0.3).restart(); });
d3.select('#charge').on('input', function() { simulation.force('charge').strength(+this.value); simulation.alpha(0.3).restart(); });

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
});

function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

d3.select('#stats').text(DATA.nodes.length + ' entities · ' + DATA.links.length + ' relationships');
</script>
