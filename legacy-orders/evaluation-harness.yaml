      - type: exists
        subject: Order
        expected: "true"
        explanation: The 'Order' model must be defined in the schema.
      - type: matches-schema
        subject: Order
        expected: Id, CustomerName, TotalAmount
        explanation: The 'Order' model must have exactly these fields with the specified names.
    priority: critical
    sourceRef: LegacyOrderProcessor/Program.cs
  - id: data-model-0002
    name: '"Order.Id" is required'
    category: data-model
    target: Order.Id
    description: Field "Id" on model "Order" must not accept null.
    assertions:
      - type: type-check
        subject: Order.Id
        expected: non-nullable
        explanation: The 'Id' field must not accept null values.
    priority: high
  - id: data-model-0003
